# Publish to PyPI over OIDC trusted publishing (no API token stored anywhere).
#
# Fires on every pushed v* tag. To (re)publish a tag that is already pushed,
# dispatch from main and pass the tag:
#   gh workflow run publish.yml -R sblattj/whosaid -f tag=v1.13.4
# Do not pass --ref <tag>: gh runs the workflow file from that ref, and older
# tags predate this file.
#
# Prereqs:
# - PyPI project whosaid -> Settings -> Publishing has a GitHub publisher for
#   owner sblattj, repo whosaid, workflow publish.yml, environment pypi.
#   Renaming this file breaks that match.
# - The tag's lib/__init__.py __version__ must equal the tag (checked below).
# - skip-existing keeps re-runs green when the version is already on PyPI.
name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish, e.g. v1.13.4"
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: astral-sh/setup-uv@v6
      - name: Check version matches tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          ver=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' lib/__init__.py)
          echo "tag=$TAG version=$ver"
          [ "v$ver" = "$TAG" ] || { echo "::error::lib/__init__.py is $ver but tag is $TAG"; exit 1; }
      - run: uv build
      - run: uvx twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/whosaid
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
